name: vantage419
description: "Premium discovery tool for Toledo residents with gamified local exploration"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4
  google_fonts: ^8.0.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.3
  flutter_launcher_icons: ^0.14.3

# App icon generation config — run: dart run flutter_launcher_icons
# Place a 1024x1024 icon at assets/icon/app_icon.png first
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/
